kind = "web"
previewPath = "/"
title = "SB.ai"
description = "An open-source, no-login AI chatbot with a focused dark blue interface and a Python API backend powered by Gemini."
version = "1.0.0"
id = "artifacts/sb-ai"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21276

[services.development]
run = "pnpm --filter @workspace/sb-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sb-ai", "run", "build" ]
serve = "static"
publicDir = "artifacts/sb-ai/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21276"
BASE_PATH = "/"
